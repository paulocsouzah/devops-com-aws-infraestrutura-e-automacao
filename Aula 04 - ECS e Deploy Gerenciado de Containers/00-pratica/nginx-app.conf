# Nginx do host (fora dos containers) — unica responsabilidade: receber
# todo o trafego externo na porta 80 e repassar para o container do
# frontend (porta 3000). O roteamento de "/api" e feito pelo nginx
# DENTRO do container do frontend, nao aqui. Este arquivo e escrito na
# instancia pelo proprio user_data.sh.tpl.
server {
    listen 80;

    location / {
        proxy_pass http://localhost:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
