# Configuracao do Nginx do HOST (fora dos containers). E gerada dentro da
# instancia pelo proprio user_data.sh.tpl (via heredoc) — este arquivo
# aqui e so uma copia de referencia, para leitura/gabarito.
#
# Responsabilidade unica: repassar tudo para o container do frontend.
# Quem decide o que e pagina e o que e chamada de API e o nginx de
# DENTRO do container do frontend (app-aula03/frontend/nginx.conf).
server {
    listen 80;

    location / {
        proxy_pass http://localhost:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
