server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # A API vive num container separado ("api"), resolvido pelo nome do
    # servico do docker-compose.yml (rede interna do Docker Compose).
    #
    # Resolucao DINAMICA de proposito (variavel + resolver), em vez de
    # "proxy_pass http://api:4000/" direto: sem isso, o nginx tenta
    # resolver "api" UMA VEZ, na inicializacao do container, e se esse
    # nome nao existir no ambiente atual o container nem sobe. Isso
    # importa porque esta mesma imagem tambem roda em ambientes (ex: ECS
    # com Services separados, sem essa rede) onde "api" nunca vai
    # resolver — mas tambem nunca vai ser chamado, porque o roteamento
    # ja acontece antes, no Load Balancer. Com resolucao dinamica, a
    # tentativa de resolver so acontece se uma requisicao real chegar
    # aqui — o que garante que o container sempre sobe, em qualquer
    # ambiente.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Sem barra final depois da variavel de proposito: com proxy_pass
    # baseado em variavel, o nginx NAO remove o prefixo "/api/" do
    # caminho original — a API recebe a requisicao exatamente como
    # "/api/usuarios", nao "/usuarios". E por isso que as rotas da API
    # (app-aula03/api/index.js) vivem sob "/api" — o mesmo comportamento
    # que o Application Load Balancer tem na Aula 04 (tambem nao remove
    # o prefixo ao encaminhar pela listener rule "/api/*").
    location /api/ {
        set $upstream_api api:4000;
        proxy_pass http://$upstream_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Qualquer outra rota volta para o index.html — o React (client-side
    # routing) decide o que renderizar.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
