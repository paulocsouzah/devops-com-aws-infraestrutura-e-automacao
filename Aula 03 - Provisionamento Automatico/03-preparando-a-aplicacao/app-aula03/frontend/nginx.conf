server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # A API vive num container separado ("api"), resolvido pelo nome do
    # servico do docker-compose.yml (rede interna do Docker Compose).
    # Isso funciona identico em desenvolvimento local e em producao (EC2),
    # porque os dois usam o mesmo docker-compose.yml.
    location /api/ {
        proxy_pass http://api:4000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Qualquer outra rota volta para o index.html — o React (client-side
    # routing) decide o que renderizar.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
